name: Vérification sur émulateur
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android71
            echo: "1"     # serveur qui ignore « action » (cas réel) : catalogue via get.php
            api: 25
            target: google_apis
            profile: tv_1080p
          - name: androidtv9
            api: 28
            target: android-tv
            profile: tv_1080p
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilation (release)
        run: gradle assembleRelease --no-daemon

      - name: Médias + faux serveur IPTV
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q pillow
          bash tools/ci/make_media.sh
          MOCK_ECHO="${{ matrix.echo }}" nohup python3 tools/ci/mock_xtream.py media > mock.log 2>&1 &
          sleep 3 && curl -s "http://localhost:8000/player_api.php?username=demo&password=demo" | head -c 120

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests de navigation (${{ matrix.name }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86
          profile: ${{ matrix.profile }}
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect -no-window
          script: bash tools/ci/run_ui.sh ${{ matrix.name }}

      - name: Publier le rapport
        if: always()
        run: |
          mkdir -p report && cp mock.log report/ 2>/dev/null || true
          cp -r report /tmp/report
          git config user.name "flux-ci"
          git config user.email "flux-ci@users.noreply.github.com"
          git checkout --orphan rapport
          git rm -rq --cached . && git clean -fdxq -e .git
          cp -r /tmp/report/. .
          git add -A && git commit -qm "Rapport ${{ matrix.name }} (${{ github.sha }})"
          git push -fq origin HEAD:refs/heads/rapport-${{ matrix.name }}
