name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilation
        run: gradle assembleRelease --no-daemon
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk FluxTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FluxTV-apk
          path: FluxTV.apk
